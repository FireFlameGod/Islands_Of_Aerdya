<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Project Tycoon</title>
    <style>
      /* Ez a rész felel a háttérszínért és az üres terek eltüntetéséért */
      body { 
        background-color: #000000 !important; 
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0; background: #000000;">
    <canvas id="unity-canvas" width=1280 height=720 tabindex="-1" style="width: 1280px; height: 720px; background: #000000"></canvas>
    <script src="Build/MonsterFarmBuild.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/MonsterFarmBuild.data.unityweb",
        frameworkUrl: "Build/MonsterFarmBuild.framework.js.unityweb",
        codeUrl: "Build/MonsterFarmBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Project Tycoon",
        productVersion: "1.0",
      });
    </script>
  </body>
</html>
