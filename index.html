<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | Project Tycoon</title>
    <style>
      body { 
        background-color: #000000 !important; 
        margin: 0; 
        padding: 0; 
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      #unity-canvas {
        display: block;
        /* Visszaállítva a tökéletes 16:9-es arány megtartására */
        width: 100vw !important;
        height: 56.25vw !important; /* 9 / 16 = 0.5625 */
        max-height: 100vh !important;
        max-width: 177.78vh !important; /* 16 / 9 = 1.7778 */
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/MonsterFarmBuild.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/MonsterFarmBuild.data.unityweb",
        frameworkUrl: "Build/MonsterFarmBuild.framework.js.unityweb",
        codeUrl: "Build/MonsterFarmBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Project Tycoon",
        productVersion: "1.0",
      });
    </script>
  </body>
</html>
