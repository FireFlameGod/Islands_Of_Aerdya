<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity WebGL Player | Project Tycoon</title>
    <style>
      body { 
        background-color: #000000; 
        margin: 0; 
        padding: 0; 
        overflow: hidden;
        display: flex;          /* Középre igazítja a játékot */
        justify-content: center;
        align-items: center;
        height: 100vh;          /* A test kitölti az ablakot */
        width: 100vw;
      }
      #unity-canvas {
        display: block;
        
        /* Biztonsági sáv: 96%-os méret, hogy a szélén ne akadjon be az egér */
        width: 96vw !important;
        height: 54vw !important; /* 96 * 0.5625 = 54 (16:9 arány) */
        
        /* Korlátozás, hogy ne lépje túl a képernyő magasságát */
        max-height: 96vh !important;
        max-width: 170.66vh !important; /* 96 * 1.7778 = 170.66 (16:9 arány) */
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/MonsterFarmBuild.loader.js"></script>
    <script>
      // 1. Keep-alive: 10 másodpercenként futtat egy üres műveletet,
      // hogy a böngésző ne állítsa le a JavaScript futását háttérben.
      setInterval(() => {
        console.log("Keep-alive ping");
      }, 10000); 

      // 2. Figyeljük, ha a játékos elhagyja a fület
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          console.warn("A játék a háttérbe került!");
        } else {
          console.log("A játék újra aktív.");
        }
      });

      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/MonsterFarmBuild.data.unityweb",
        frameworkUrl: "Build/MonsterFarmBuild.framework.js.unityweb",
        codeUrl: "Build/MonsterFarmBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Project Tycoon",
        productVersion: "1.0",
      });
    </script>
  </body>
</html>
